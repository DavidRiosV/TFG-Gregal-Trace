{% load static %}
<aside class="menu" aria-label="Menú principal">
    <a class="menu__marca" href="{% url 'index' %}">
        <img src="{% static 'img/logo.png' %}" alt="" width="40" height="40">
        <span>Gregal Trace</span>
    </a>

    <nav class="menu__lista">
        <a class="menu__enlace{% if seccion == 'inicio' %} menu__enlace--activo{% endif %}" href="{% url 'index' %}"{% if seccion == 'inicio' %} aria-current="page"{% endif %}>
            {% include "gestion/icono.html" with nombre="inicio" %}
            <span>Inicio</span>
        </a>
        {% for slug, tipo in nav_tipos.items %}
            <a class="menu__enlace{% if seccion == slug %} menu__enlace--activo{% endif %}" href="{% url 'lista_proyectos' slug %}"{% if seccion == slug %} aria-current="page"{% endif %}>
                {% include "gestion/icono.html" with nombre=slug %}
                <span>{{ tipo.titulo }}</span>
                {% if tipo.en_proceso %}<span class="menu__contador" title="En proceso">{{ tipo.en_proceso }}</span>{% endif %}
            </a>
        {% endfor %}
    </nav>
</aside>
